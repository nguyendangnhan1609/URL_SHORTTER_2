<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="auth.login.title">T</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
<div id="site-header"></div>
<main class="flex-1 relative overflow-hidden bg-gradient-to-br from-indigo-600 via-violet-600 to-cyan-500 flex items-center justify-center px-4 py-12">
  <div class="absolute -top-24 -right-24 w-96 h-96 rounded-full bg-pink-500/30 blur-3xl"></div>
  <div class="absolute -bottom-32 -left-24 w-96 h-96 rounded-full bg-orange-400/30 blur-3xl"></div>
  <div class="relative w-full max-w-md bg-white rounded-3xl shadow-2xl p-6 sm:p-8">
    <h1 class="text-2xl font-extrabold" data-i18n="auth.login.heading">H</h1>
    <p class="text-slate-500 text-sm mt-1 mb-6" data-i18n="auth.login.subtitle">S</p>
    <form id="form" class="space-y-4" novalidate>
      <div><label class="block text-sm font-medium mb-1" for="email" data-i18n="auth.email">Email</label>
        <input id="email" type="email" required autocomplete="email" class="w-full border border-slate-200 rounded-2xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-violet-500"></div>
      <div><label class="block text-sm font-medium mb-1" for="password" data-i18n="auth.password">Password</label>
        <div class="relative">
          <input id="password" type="password" required minlength="8" autocomplete="current-password" class="w-full border border-slate-200 rounded-2xl px-4 py-3 pr-24 focus:outline-none focus:ring-2 focus:ring-violet-500">
          <button id="toggle-pw" type="button" aria-pressed="false" class="absolute inset-y-0 right-2 my-auto h-9 px-3 rounded-xl text-sm font-semibold text-violet-700 hover:bg-violet-50" data-i18n="auth.showPassword">Show</button>
        </div>
      </div>
      <button id="submit" type="submit" class="w-full px-4 py-3 rounded-2xl font-bold text-white bg-gradient-to-r from-indigo-600 via-violet-600 to-cyan-500 shadow-lg shadow-indigo-200 hover:opacity-90 disabled:opacity-50 transition" data-i18n="auth.login.submit">S</button>
      <p id="error" class="text-red-600 text-sm hidden" role="alert"></p>
      <p class="text-sm text-center"><a class="text-indigo-600 font-semibold hover:underline" href="/register" data-i18n="auth.noAccount">x</a></p>
    </form>
  </div>
</main>
<div id="site-footer"></div>
<script src="/i18n.js"></script>
<script src="/layout.js"></script>
<script>
(function () {
  var errEl = document.getElementById('error'), lastCode = null, submitting = false;
  var pw = document.getElementById('password'), tog = document.getElementById('toggle-pw'), btn = document.getElementById('submit');
  function pwLabel() { tog.textContent = I18N.t(pw.type === 'password' ? 'auth.showPassword' : 'auth.hidePassword'); }
  tog.addEventListener('click', function () {
    pw.type = pw.type === 'password' ? 'text' : 'password';
    tog.setAttribute('aria-pressed', pw.type === 'text' ? 'true' : 'false');
    pwLabel();
  });
  function showErr(code) { lastCode = code; errEl.textContent = App.errText(code); errEl.classList.remove('hidden'); }
  I18N.onChange(function () {
    pwLabel();
    if (lastCode) errEl.textContent = App.errText(lastCode);
    if (submitting) btn.textContent = I18N.t('auth.submitting');
  });
  document.getElementById('form').addEventListener('submit', async function (e) {
    e.preventDefault(); errEl.classList.add('hidden'); lastCode = null;
    var email = document.getElementById('email').value.trim();
    submitting = true; btn.disabled = true; btn.textContent = I18N.t('auth.submitting');
    try {
      await App.api('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: pw.value }) });
      location.href = '/dashboard';
    } catch (err) { showErr(err.code); submitting = false; btn.disabled = false; btn.textContent = I18N.t('auth.login.submit'); }
  });
})();
</script>
</body>
</html>
